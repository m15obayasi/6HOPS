name: Prepare Daily challenge

on:
  schedule:
    # 23:00 in Japan (14:00 UTC): validate tomorrow's challenge before it goes live.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Challenge date (YYYY-MM-DD); blank prepares tomorrow in Japan'
        required: false
        type: string
      deploy:
        description: 'Deploy the current validated Daily data even when no override changed'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-daily-challenge
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    defaults:
      run:
        working-directory: video

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve target date
        id: challenge
        shell: bash
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -d tomorrow +%F); fi
          if ! [[ "$DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Validate challenge and choose a fallback when needed
        run: node prepare_daily_challenge.js --date "${{ steps.challenge.outputs.date }}"

      - name: Commit a date override when the challenge changed
        id: override
        shell: bash
        run: |
          if git diff --quiet -- ../js/daily-data.js; then
            echo "The scheduled challenge is valid; no override was needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../js/daily-data.js
          git commit -m "Replace invalid Daily challenge for ${{ steps.challenge.outputs.date }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy validated Daily data to myeik.net
        if: steps.override.outputs.changed == 'true' || github.event.inputs.deploy == 'true'
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FORCE_DEPLOY: ${{ github.event.inputs.deploy }}
        run: |
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required secret is missing: $name" >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file ../js/daily-data.js \
            "ftp://$FTP_HOST/myeik.net/6HOPS/js/daily-data.js"
          curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file ../js/.htaccess \
            "ftp://$FTP_HOST/myeik.net/6HOPS/js/.htaccess"
          if [ "$FORCE_DEPLOY" = "true" ]; then
            temp_dir=$(mktemp -d)
            trap 'rm -rf "$temp_dir"' EXIT
            for page in index.html en/index.html de/index.html fr/index.html zh/index.html; do
              local_file="$temp_dir/${page//\//-}"
              curl --fail --silent --show-error --ssl-reqd \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                --output "$local_file" \
                "ftp://$FTP_HOST/myeik.net/6HOPS/$page"
              perl -0pi -e 's/daily-data\.js\?v=[^"]+/daily-data.js?v=1.4/g' "$local_file"
              curl --fail --silent --show-error --ssl-reqd \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                --upload-file "$local_file" \
                "ftp://$FTP_HOST/myeik.net/6HOPS/$page"
            done
          fi
