name: Prepare Daily challenge

on:
  schedule:
    # 23:00 in Japan (14:00 UTC): validate tomorrow's challenge before it goes live.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Challenge date (YYYY-MM-DD); blank prepares tomorrow in Japan'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-daily-challenge
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    defaults:
      run:
        working-directory: video

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve target date
        id: challenge
        shell: bash
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -d tomorrow +%F); fi
          if ! [[ "$DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Validate challenge and choose a fallback when needed
        run: node prepare_daily_challenge.js --date "${{ steps.challenge.outputs.date }}"

      - name: Commit a date override when the challenge changed
        shell: bash
        run: |
          if git diff --quiet -- ../js/daily-data.js; then
            echo "The scheduled challenge is valid; no override was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../js/daily-data.js
          git commit -m "Replace invalid Daily challenge for ${{ steps.challenge.outputs.date }}"
          git push origin HEAD:main
