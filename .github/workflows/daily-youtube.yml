name: Daily YouTube videos

on:
  schedule:
    # 18:00 in Japan (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Challenge date (YYYY-MM-DD); blank uses today in Japan'
        required: false
        type: string
      privacy:
        description: 'YouTube visibility'
        required: true
        default: public
        type: choice
        options:
          - public
          - unlisted
          - private
      upload:
        description: 'Upload generated videos to YouTube'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-youtube-${{ github.event.inputs.date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    defaults:
      run:
        working-directory: video

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and video dependencies
        run: npx playwright-core install --with-deps chromium

      - name: Resolve challenge date
        id: challenge
        shell: bash
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date +%F); fi
          if ! [[ "$DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Restore same-day upload history
        id: upload-cache
        uses: actions/cache/restore@v6
        with:
          path: video/youtube/upload-history.json
          key: youtube-upload-${{ steps.challenge.outputs.date }}

      - name: Generate and publish Japanese and English videos
        shell: bash
        run: |
          PRIVACY="${{ github.event.inputs.privacy }}"
          if [ -z "$PRIVACY" ]; then PRIVACY=public; fi
          UPLOAD="${{ github.event.inputs.upload }}"
          EXTRA_ARGS=()
          if [ "$UPLOAD" = "false" ]; then EXTRA_ARGS+=(--skip-upload); fi
          node create_daily_videos.js \
            --date "${{ steps.challenge.outputs.date }}" \
            --privacy "$PRIVACY" \
            "${EXTRA_ARGS[@]}"

      - name: Preserve upload history for safe retry
        if: always() && github.event.inputs.upload != 'false' && hashFiles('video/youtube/upload-history.json') != '' && steps.upload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: video/youtube/upload-history.json
          key: youtube-upload-${{ steps.challenge.outputs.date }}
