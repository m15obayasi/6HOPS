    <script>
        $(document).ready(function() {
            const title1 = localStorage.getItem('title1');
            const title2 = localStorage.getItem('title2');
            if (title1 && title2) {
                localStorage.removeItem('title1');
                localStorage.removeItem('title2');
                targetArticleTitleB = title2; // Save target article title to global variable
                fetchWikipediaArticle(title1);
                displayGoal(title2); // Display target article title and summary
                $('img.logo').hide(); // Hide the illustration
                $('.rectangleContainer').remove();
                $('.startBlock').hide();
                $('.aboutLink').hide();
                $('.wikiBlock').addClass('loaded'); // Change background and border color
                $('.menuIcon').show(); // Show hamburger menu
                $('.title').text('0 / 6HOPS'); // Reset title
                $('.titleUnderline').hide(); // Hide the underline below the title

                // Add click event for share button
                $('.shareLink').attr('href', `https://twitter.com/intent/tweet?text=${encodeURIComponent('Challenging 6HOPS from "' + title1 + '" to "' + title2 + '"! \n#TRY_6HOPS\nhttps://myeik.net/6HOPS/fr')}`);
            }
        });
    </script>
