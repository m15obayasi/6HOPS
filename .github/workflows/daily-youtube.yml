name: Daily YouTube videos
on:
  schedule:
    # Start recording at 18:00 Japan time; publish after recording and verification.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Challenge date (YYYY-MM-DD); blank uses today in Japan
        required: false
        type: string
      privacy:
        description: YouTube visibility
        required: true
        default: public
        type: choice
        options: [public, unlisted, private]
      upload:
        description: Upload verified videos to YouTube
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: daily-youtube
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: Resolve challenge date
        id: challenge
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DATE="$INPUT_DATE"
          if [ -z "$DATE" ]; then DATE=$(date +%F); fi
          if ! [[ "$DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
      - name: Restore publication history
        if: github.event.inputs.upload != 'false'
        uses: actions/cache/restore@v6
        with:
          path: video/youtube/upload-history.json
          key: youtube-ios-uploads-${{ steps.challenge.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-ios-uploads-${{ steps.challenge.outputs.date }}-
      - name: Record actual iPhone app and compose both languages
        env:
          CHALLENGE_DATE: ${{ steps.challenge.outputs.date }}
        run: node create_daily_videos.js --source ios --date "$CHALLENGE_DATE" --skip-upload
      - name: Verify both videos before publication
        env:
          CHALLENGE_DATE: ${{ steps.challenge.outputs.date }}
        run: node verify_ios_samples.js --date "$CHALLENGE_DATE"
      - name: Publish Japanese and English Shorts
        if: github.event.inputs.upload != 'false'
        env:
          CHALLENGE_DATE: ${{ steps.challenge.outputs.date }}
          PRIVACY: ${{ inputs.privacy || 'public' }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          for LOCALE in JA EN; do
            FILE="6HOPS-Daily-Playthrough-$LOCALE-$CHALLENGE_DATE.mp4"
            if node -e 'const fs=require("fs");const p="youtube/upload-history.json";const h=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)): {uploads:[]};process.exit(h.uploads.some(x=>x.file===process.argv[1])?0:1)' "$FILE"; then
              echo "Already published this date and language: $FILE"
            else
              node youtube/upload-latest.js --file "$FILE" --privacy "$PRIVACY"
            fi
          done
      - name: Preserve publication history for safe retries
        if: always() && github.event.inputs.upload != 'false' && hashFiles('video/youtube/upload-history.json') != ''
        uses: actions/cache/save@v6
        with:
          path: video/youtube/upload-history.json
          key: youtube-ios-uploads-${{ steps.challenge.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save videos and real-app verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-iphone-shorts-${{ steps.challenge.outputs.date }}
          retention-days: 7
          path: |
            video/6HOPS-Daily-Playthrough-*.mp4
            video/6HOPS-Daily-Playthrough-*-thumbnail.jpg
            video/6HOPS-Daily-Playthrough-*-shorts-cover.jpg
            video/output/*-ios-recording.json
            video/output/*-ios-test.log
            video/output/*-ios-raw.mov
            video/output/*-home-*.png
            video/output/*-article-*.png
            video/output/*-result-*.png
            video/output/ios-verification-*.json
            video/youtube/upload-history.json
