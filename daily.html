<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6HOPS</title>
    <link rel="stylesheet" href="./css/style.css?v=3.4"> <!-- スタイルをstyle.cssに集約 -->
    <link href="https://fonts.googleapis.com/css?family=Cherry+Swash:700" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans+JP">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400&display=swap">
    <!-- Zen Maru Gothicを追加 -->
    <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
    <meta property="og:image" content="./img/wikiLogo.png">
    <meta name="google-adsense-account" content="ca-pub-8967129057333443">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8967129057333443"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> <!-- jQueryを追加 -->
    <script src="./js/wiki.js"></script> <!-- wiki.jsを追加 -->
    <script src="./js/daily.js"></script> <!-- 新しいスクリプトファイルを読み込み -->
</head>

<body class="daily">
    <div class="fixedScreen">
        <div class="menuIcon" style="display: none;">&#9776;</div>
        <div class="title">6HOPS</div>
        <div class="titleUnderline"></div>
        <hr>
    </div>

    <div class="sideMenu" style="display: none;">
        <div class="menuHeader">
            <div class="closeMenu">CLOSE</div> <!-- 閉じるボタン -->
            <h2></h2>
        </div>
        <h2>　</h2>
        <div class="history"></div>
        <div class="goalTitle"></div>
        <div class="hintBlock">ヒント</div> <!-- ヒントボタン -->
        <div class="goalSummary"></div>
        <h2>　</h2>
        <h2 class="homeLink">ホームに戻る</h2> <!-- ホームリンク -->
        <div class="shareButton">
            <a href="#" class="shareLink" target="_blank">
                <img src="./img/logo-black.png" alt="Share Logo" class="shareLogo">
                でシェアする
            </a>
        </div>
    </div>

    <div class="rectangleContainer">
        <div class="rectangleLabel first"></div> <!-- テキストはスクリプトで設定 -->
        <div class="rectangle"></div>
        <div class="rectangleLabel second"></div>
        <div class="rectangle"></div>
    </div>
    <div class="progressBar" style="display: none;"></div>

    <div class="startBlock">
        <div class="start">START</div>
    </div>

    <div class="aboutLink">
        <a href="./outset.html">このサイトについて</a>
    </div>
    <div class="wikiBlock"></div> <!-- 初期状態で非表示を削除 -->

</body>

</html>
