<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W3NNXDSG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="fixedScreen">
        <div class="menuIcon" style="display: none;">&#9776;</div> <!-- 汉堡菜单 -->
        <div class="title">6HOPS</div>
        <div class="titleUnderline"></div> <!-- 在标题下添加下划线 -->
        <hr>
    </div>

    <div class="sideMenu" style="display: none;">
        <div class="menuHeader">
            <div class="closeMenu">关闭</div> <!-- 关闭按钮 -->
            <h2></h2>
        </div>
        <h2>　</h2>
        <div class="history"></div>
        <div class="goalTitle"></div>
        <div class="hintBlock">提示</div> <!-- 提示按钮 -->
        <div class="goalSummary"></div>
        <h2>　</h2>
        <h2 class="homeLink">返回首页</h2>        <!-- 分享按钮 -->
        <div class="shareButton">
            <a href="#" class="shareLink" target="_blank">
                <img src="../img/logo-black.png" alt="Share Logo" class="shareLogo">
                分享
            </a>
        </div>
    </div>

    <div class="rectangleContainer">
        <div class="rectangleLabel first">第一个文章</div>
        <div class="rectangle"></div>
        <div class="rectangleLabel second">第六个文章</div>
        <div class="rectangle"></div>
    </div>
    <div class="progressBar" style="display: none;"></div>

    <div class="startBlock">
        <div class="start">开始</div>
    </div>
    <div class="aboutLink">
        <a href="./outset.html">关于本站</a>
    </div>
    <div class="wikiBlock"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/wiki_zh.js?v=3.4"></script> <!-- パラメータクエリを更新 -->
    <script>
        $(document).ready(function() {
            const title1 = localStorage.getItem('title1');
            const title2 = localStorage.getItem('title2');
            if (title1 && title2) {
                localStorage.removeItem('title1');
                localStorage.removeItem('title2');
                targetArticleTitleB = title2; // 保存目标文章标题到全局变量
                fetchWikipediaArticle(title1);
                displayGoal(title2); // 显示目标文章标题和摘要
                $('img.logo').hide(); // 隐藏插图
                $('.rectangleContainer').remove();
                $('.startBlock').hide();
                $('.aboutLink').hide();
                $('.wikiBlock').addClass('loaded'); // 更改背景色和边框颜色
                $('.menuIcon').show(); // 显示汉堡菜单
                $('.title').text('0 / 6HOPS'); // 重置标题
                $('.titleUnderline').hide(); // 隐藏标题下的下划线

                // 添加分享按钮的点击事件
                $('.shareLink').attr('href', `https://twitter.com/intent/tweet?text=${encodeURIComponent('挑战6HOPS，从"' + title1 + '"到"' + title2 + '"！ \n#TRY_6HOPS\nhttps://myeik.net/6HOPS/zh')}`);
            }
        });
    </script>

</body>
