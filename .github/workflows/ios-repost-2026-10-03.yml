name: Repost updated iPhone Shorts for 2026-10-03
on:
  push:
    branches: [codex/ios-repost-2026-10-03]
    paths: [.github/workflows/ios-repost-2026-10-03.yml]
permissions:
  contents: read
concurrency:
  group: ios-repost-2026-10-03
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
        working-directory: video
      - name: Record and compose actual iPhone app in Japanese and English
        working-directory: video
        run: node create_daily_videos.js --source ios --date 2026-10-03 --skip-upload
      - name: Verify both videos before publishing
        working-directory: video
        run: node verify_ios_samples.js --date 2026-10-03
      - name: Publish updated Japanese and English Shorts
        working-directory: video
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          node youtube/upload-latest.js --file 6HOPS-Daily-Playthrough-JA-2026-10-03.mp4 --privacy public
          node youtube/upload-latest.js --file 6HOPS-Daily-Playthrough-EN-2026-10-03.mp4 --privacy public
      - name: Preserve videos and publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updated-iphone-shorts-2026-10-03
          retention-days: 7
          path: |
            video/6HOPS-Daily-Playthrough-*-2026-10-03.mp4
            video/6HOPS-Daily-Playthrough-*-2026-10-03-thumbnail.jpg
            video/output/*-ios-recording.json
            video/output/*-ios-test.log
            video/output/ios-verification-*.json
            video/output/*-ios-raw.mov
            video/output/*-home-*.png
            video/output/*-ready-*.png
            video/output/*-article-*.png
            video/output/*-result-*.png
            video/youtube/upload-history.json
# Record with a simulator-only render heartbeat to preserve static screens.
